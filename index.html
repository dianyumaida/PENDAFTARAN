<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pendaftaran Validasi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Form Pendaftaran</h2>
        <form id="formPendaftaran">
            <div class="form-group">
                <label>No / Kode:</label>
                <input type="text" id="inputNo" required placeholder="Contoh: A01">
            </div>
            <div class="form-group">
                <label>Angka:</label>
                <input type="number" id="inputAngka" required placeholder="Contoh: 100">
            </div>
            <div class="form-group">
                <label>No. HP:</label>
                <input type="text" id="inputHp" required placeholder="08xxxxxx">
            </div>
            <div class="form-group">
                <label>Alamat:</label>
                <textarea id="inputAlamat" required placeholder="Masukkan alamat lengkap"></textarea>
            </div>
            <div class="form-group">
                <label>Keterangan:</label>
                <textarea id="inputKet" placeholder="Keterangan tambahan (opsional)"></textarea>
            </div>
            <button type="submit">Daftar Sekarang</button>
        </form>

        <!-- Area untuk menampilkan notifikasi dan tombol lihat detail data -->
        <div id="notifikasiArea" class="hidden"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
