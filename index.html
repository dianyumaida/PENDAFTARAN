<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kirim File Langsung ke Email</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 50px; }
        .box { max-width: 400px; background: white; padding: 30px; margin: auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        label { font-weight: bold; color: #555; }
        input[type="email"], input[type="file"] { width: 100%; padding: 10px; margin: 10px 0 20px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
    </style>
</head>
<body>

<div class="box">
    <h2>Form Kirim File</h2>
    <form action="https://api.web3forms.com/submit" method="POST" enctype="multipart/form-data">
    
    <!-- Paste Kode Access Key Anda di bawah ini -->
    <input type="hidden" name="access_key" value="b5f35c7f-28d7-40b3-ba17-f6ca2d449a39">

    <!-- Input Email Pengunjung (Wajib menggunakan name="email") -->
    <label>Email Anda (Pengirim):</label>
    <input type="email" name="email" placeholder="nama_kamu@email.com" required>

    <!-- Input Lampiran File (Wajib menggunakan name="attachment") -->
    <label>Pilih File:</label>
    <input type="file" name="attachment" required>

    <button type="submit" name="submit">Kirim ke Email</button>
</form>

</div>

</body>
</html>
