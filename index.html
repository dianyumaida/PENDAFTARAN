<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirim File Langsung ke Email</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .box { max-width: 400px; background: white; padding: 25px; margin: 30px auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; font-size: 22px; }
        label { font-weight: bold; color: #555; display: block; margin-top: 15px; }
        input[type="text"], input[type="email"], select, input[type="file"] { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 14px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        button:hover { background: #218838; }
    </style>
</head>
<body>

<div class="box">
    <h2>Form Kirim File</h2>
    
    <form action="https://web3forms.com" method="POST" enctype="multipart/form-data">
        
        <!-- MENU PILIHAN TUJUAN EMAIL -->
        <label>Pilih Tujuan Pengiriman Email:</label>
        <select name="access_key" required>
            <option value="">-- Pilih Tujuan --</option>
            <!-- MASUKKAN TOKEN EMAIL 1 DI BAWAH INI -->
            <option value="b5f35c7f-28d7-4...">Kirim ke Admin (Email 1)</option>
            <!-- MASUKKAN TOKEN EMAIL 2 DI BAWAH INI (Jika Ada) -->
            <option value="KODE_ACCESS_KEY_KEDUA_KAMU">Kirim ke Manajer (Email 2)</option>
        </select>

        <!-- INPUT NAMA PENGIRIM -->
        <label>Nama Pengirim:</label>
        <input type="text" name="name" placeholder="Nama Anda" required>

        <!-- INPUT EMAIL PENGIRIM (REPLY-TO) -->
        <label>Email Anda (Pengirim):</label>
        <input type="email" name="email" placeholder="nama_kamu@email.com" required>

        <!-- INPUT LAMPIRAN FILE (Wajib name="attachment") -->
        <label>Pilih File:</label>
        <input type="file" name="attachment" required>

        <!-- TOMBOL KIRIM -->
        <button type="submit">Kirim ke Email</button>
    </form>
</div>

</body>
</html>
